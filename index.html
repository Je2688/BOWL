<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gridiron Legends</title>
<style>
html,body{margin:0;height:100%;background:#0d1f0d;color:#fff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;height:min(100vh,150vw);aspect-ratio:2/3}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.p{pointer-events:auto;background:#10240fee;border:3px solid #f5c400;padding:14px 16px;max-width:86%;text-align:center;font-size:clamp(11px,2.5vh,15px);line-height:1.5}
.p h2{margin:0 0 8px;color:#f5c400;letter-spacing:2px}
button{font:inherit;font-weight:bold;background:#f5c400;color:#10240f;border:0;padding:7px 11px;margin:3px;cursor:pointer}
button:disabled{background:#4a5a49;color:#8a9a89}
#jk{position:absolute;right:8px;bottom:22px;display:none;padding:14px 18px;background:#3a9bff;color:#fff}
.r{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:6px;align-items:center;text-align:left}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#lb{width:200px;height:12px;border:2px solid #f5c400;margin:10px auto}
#lf{display:block;height:100%;width:0;background:#f5c400}
</style></head><body>
<div id="g"><canvas id="c" width="240" height="360"></canvas><div id="ov"></div><button id="jk">JUKE</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),OV=document.getElementById('ov'),JK=document.getElementById('jk');
const W=240,H=360,YD=8,FL=960,GOAL=80,R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),wy=y=>(110-y)*YD;
const TM=[['Rhinos','#7d8590','#f5c400'],['Comets','#2f8cff','#ffffff'],['Vipers','#26a844','#111111'],['Titans','#7a3cc8','#ffd23f'],['Bears','#c8501e','#ffffff'],['Hawks','#16a8a8','#ffffff'],['Sharks','#2a45c8','#9eeaff'],['Wolves','#b01e3c','#dddddd']];
const FN=['Jake','Marcus','Tyler','Deon','Luis','Kai','Omar','Ben','Cole','Zane','Rico','Sam'],LN=['Stone','Rivers','Cruz','Hayes','Dunn','Brooks','Vega','Reed','Wade','Knox','Frost','Penn'];
let S;try{S=JSON.parse(localStorage.getItem('gl2'))}catch(e){}
S=S||{tm:null,wk:0,w:0,l:0,cr:3,ro:[]};
const save=()=>{try{localStorage.setItem('gl2',JSON.stringify(S))}catch(e){}};
const av=(a,b)=>{let s=0;for(let i=a;i<=b;i++)s+=S.ro[i].o;return s/(b-a+1)-1};
const U={get qb(){return S.ro[0].o-1},get wr(){return av(1,3)},get df(){return av(4,6)},get kk(){return S.ro[7].o-1}};
let G=null,keys={},ptr={sx:120,sy:0,x:120,y:0,d:false},last=0,AC;
const oppIdx=()=>(S.tm+1+S.wk%7)%8,opp=()=>TM[oppIdx()],oppLv=()=>1+Math.floor(S.wk/2);
function beep(f,d=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- screens ---------- */
const LOGO='<h2>GRIDIRON<br>LEGENDS</h2>';
function boot(){let p=0;OV.innerHTML=`<div class=p>${LOGO}<div id=lb><i id=lf></i></div>LOADING...</div>`;
  const iv=setInterval(()=>{p+=4+R()*8;lf.style.width=Math.min(100,p)+'%';
    if(p>=100){clearInterval(iv);OV.innerHTML=`<div class=p>${LOGO}<button onclick="start()">PRESS START</button></div>`}},120)}
function start(){beep(440,.1);S.tm==null?pick():hub()}
function mkRoster(){const P=['QB','WR','WR','WR','DL','LB','DB','K'],pk=a=>a[Math.floor(R()*a.length)];
  return P.map(p=>({p,n:pk(FN)+' '+pk(LN),o:1+Math.floor(R()*3)}))}
function pick(){OV.innerHTML=`<div class=p><h2>CHOOSE YOUR TEAM</h2><div class=tg>`+
  TM.map((t,i)=>`<button style="background:${t[1]};color:${t[2]}" onclick="sel(${i})">${t[0].toUpperCase()}</button>`).join('')+`</div></div>`}
function sel(i){S={tm:i,wk:0,w:0,l:0,cr:3,ro:mkRoster()};save();beep(660,.15);hub()}
function hub(){G=null;const t=TM[S.tm],o=opp();
  OV.innerHTML=`<div class=p><h2 style="color:${t[1]}">${t[0].toUpperCase()}</h2>Week ${S.wk+1}/8 &nbsp; Record ${S.w}-${S.l}<br>Credits ${S.cr}<br>Next: vs <b style="color:${o[1]}">${o[0]}</b> (rating ${oppLv()})<br><br>
  <button onclick="newGame()">PLAY GAME</button><br><button onclick="roster()">ROSTER</button><button onclick="if(confirm('Start a new career?'))pick()">NEW CAREER</button><br>
  <small>Arrows/WASD or drag: move<br>Tap receiver or 1-2-3: throw<br>Space: snap / juke</small></div>`}
function roster(){OV.innerHTML=`<div class=p><h2 style="color:${TM[S.tm][1]}">${TM[S.tm][0].toUpperCase()} ROSTER</h2>Credits ${S.cr}<br>`+
  S.ro.map((r,i)=>{const c=r.o+1,mx=r.o>=5;return `<div class=r><b>${r.p}</b><span>${r.n}</span><span>${'★'.repeat(r.o)}${'☆'.repeat(5-r.o)}</span><button ${mx||S.cr<c?'disabled':''} onclick="UP(${i})">${mx?'MAX':'+'+c}</button></div>`}).join('')+
  `<br><button onclick="hub()">BACK</button></div>`}
function UP(i){const r=S.ro[i],c=r.o+1;if(r.o<5&&S.cr>=c){S.cr-=c;r.o++;save();beep(600,.1);roster()}}

/* ---------- field texture ---------- */
const F=document.createElement('canvas');F.width=W;F.height=FL;
function build(){const f=F.getContext('2d'),m=TM[S.tm],o=opp();
  f.fillStyle='#0a1a0a';f.fillRect(0,0,W,FL);
  for(let y=0;y<FL;y+=3)for(let x=0;x<14;x+=3){f.fillStyle=['#c33','#39c','#eb3','#ddd','#3a5','#a4c'][Math.floor(R()*6)];f.globalAlpha=.5;f.fillRect(x,y,2,2);f.fillRect(x+226,y,2,2)}
  f.globalAlpha=1;
  for(let yd=0;yd<120;yd++){const y=yd*YD;
    f.fillStyle=yd<10?o[1]:yd>=110?m[1]:(Math.floor((yd-10)/5)%2?'#2b8a30':'#319a36');f.fillRect(16,y,208,YD);
    if(yd>=10&&yd<110){for(let k=0;k<10;k++){f.fillStyle=R()<.5?'#ffffff12':'#00000014';f.fillRect(16+Math.floor(R()*206),y+Math.floor(R()*8),2,1)}
      f.fillStyle='#ffffff66';f.fillRect(100,y+3,2,1);f.fillRect(138,y+3,2,1)}
    if(yd>=10&&yd<=110&&(yd-10)%5==0){f.fillStyle=(yd==10||yd==110)?'#fff':'#ffffffaa';f.fillRect(16,y,208,(yd==10||yd==110)?2:1);
      const n=Math.min(110-yd,yd-10);if((yd-10)%10==0&&n>0){f.font='bold 12px "Courier New"';f.textAlign='center';f.fillStyle='#ffffffcc';f.fillText(n,40,y+16);f.fillText(n,200,y+16)}}}
  f.font='bold 18px "Courier New"';f.textAlign='center';f.fillStyle=o[2];f.fillText(o[0].toUpperCase(),120,50);f.fillStyle=m[2];f.fillText(m[0].toUpperCase(),120,930);
  f.fillStyle='#fff';f.fillRect(14,0,2,FL);f.fillRect(224,0,2,FL);f.fillRect(14,0,212,1);f.fillRect(14,FL-1,212,1)}

/* ---------- game flow ---------- */
function newGame(){OV.innerHTML='';const m=TM[S.tm],o=opp();
  G={me:0,op:0,o:oppLv(),q:1,clock:75,down:1,toGo:10,yl:25,msg:'KICKOFF',cam:0,mc:m[1],mc2:m[2],oc:o[1],oc2:o[2]};build();setup();G.cam=cl(G.qb.y-250,0,FL-H)}
function mkRoute(x,y,s){const k=Math.floor(R()*5);
  const P=[[[0,-240]],[[0,-70],[-s*60,-70],[-s*60,-240]],[[s*40,-50],[s*70,-240]],[[0,-90],[s*55,-240]],[[0,-80],[0,-62]]][k];
  return{x,y,i:0,stop:k==4,wp:P.map(([a,b])=>[cl(x+a,20,220),y+b])}}
function setup(){
  G.toGo=Math.min(G.toGo,100-G.yl);const los=G.los=wy(G.yl);
  G.qb={x:120,y:los+26};G.t=0;G.ball=null;G.car=null;
  G.rc=[[34,2,1],[206,2,-1],[160,12,-1]].map(([x,d,s])=>mkRoute(x,los+d,s));
  G.df=[80,105,135,160].map(x=>({x,y:los-6,t:'r'}))
    .concat(G.rc.map((r,i)=>({x:r.x,y:los-30-i*3,t:'c',i}))).concat([{x:120,y:los-24,t:'s'}]);
  G.ph='pre';if(G.down==4)four()}
function snap(){G.msg='';G.ph='live';G.t=0;beep(220,.06)}
function four(){G.ph='four';const d=100-G.yl+17,can=d<=58;
  OV.innerHTML=`<div class=p><h2>4th &amp; ${G.toGo}</h2><button onclick="go4(0)">GO FOR IT</button><br><button onclick="go4(1)" ${can?'':'disabled'}>FIELD GOAL (${d} yd)</button><br><button onclick="go4(2)">PUNT</button></div>`}
function go4(k){OV.innerHTML='';if(k==0){G.ph='pre';return}
  let m,p=0;G.clock-=8;
  if(k==1){const d=100-G.yl+17,pr=cl(.97-(d-20)*.017+U.kk*.05,.05,.97);
    if(R()<pr){G.me+=3;beep(660,.3);m='FIELD GOAL IS GOOD! +3';p=oppDrive(.8)}else{m='FIELD GOAL MISSED!';p=oppDrive(1)}}
  else{m='PUNT';p=oppDrive(.5)}
  flip(m,p)}
function oppDrive(m=1){if(R()<(.4+.07*G.o-.05*U.df)*m){const p=R()<.55?7:3;G.op+=p;return p}return 0}
function flip(m,p){G.yl=25;G.down=1;G.toGo=10;G.msg=m+(p?'  OPP SCORES '+p:'');G.ph='dead';G.mt=2}
function td(){G.me+=7;beep(880,.3);G.clock-=5;flip('TOUCHDOWN! +7',oppDrive(.8))}
function turnover(m){G.clock-=4;flip(m,oppDrive(1));beep(150,.3)}
function endPlay(y,msg,inc){
  G.clock-=inc?2:6;G.ph='dead';G.mt=1.4;
  const gain=inc?0:Math.round((G.los-y)/YD);G.yl=cl(G.yl+gain,1,99);
  if(!inc&&gain>=G.toGo){G.down=1;G.toGo=Math.min(10,100-G.yl);msg+=' FIRST DOWN!';beep(700)}
  else{G.toGo-=gain;G.down++;if(G.down>4)return turnover('TURNOVER ON DOWNS')}
  G.msg=inc?msg:msg+' ('+(gain>0?'+':'')+gain+')'}
function nxt(){
  if(G.clock<=0){G.q++;if(G.q>4)return gameOver();G.clock=75;G.msg='END OF Q'+(G.q-1)+(G.q==3?' - HALFTIME':'')}
  else G.msg='';
  setup()}
function gameOver(){
  let ot='';if(G.me==G.op){ot=' (OT)';R()<.5+U.qb*.03?G.me+=3:G.op+=3}
  const win=G.me>G.op;S.wk++;win?S.w++:S.l++;S.cr+=win?4:1;
  let sum='';if(S.wk>=8){sum=`<b>SEASON COMPLETE: ${S.w}-${S.l}</b><br>`;S.wk=0;S.w=0;S.l=0}
  save();G.ph='over';
  OV.innerHTML=`<div class=p><h2>FINAL</h2>${win?'WIN':'LOSS'} ${G.me}-${G.op}${ot}<br>+${win?4:1} credits<br>${sum}<br><button onclick="hub()">CONTINUE</button></div>`}

/* ---------- actions ---------- */
function throwTo(i){if(!G||G.ph!='live')return;const r=G.rc[i],q=G.qb,d=Math.hypot(r.x-q.x,r.y-q.y);G.ph='air';G.ball={x:q.x,y:q.y,i,t:0,d0:d,d};beep(300,.05)}
function juke(){if(G&&G.ph=='run'&&G.car.cd<=0){G.car.dash=.28;G.car.cd=1.6;beep(500,.06)}}
function runner(c,sp){Object.assign(c,{dx:0,dy:-1,cd:0,dash:0,vx:0,vy:-sp});G.car=c;G.ball=null;G.ph='run'}
function resolve(){
  const b=G.ball,r=G.rc[b.i];let dd=1e9;G.df.forEach(d=>dd=Math.min(dd,Math.hypot(d.x-r.x,d.y-r.y)));
  const pc=cl(.5+U.wr*.07+(dd-8)*.025,.12,.95);
  if(R()<pc){runner(r,58);beep(520)}
  else if(dd<14&&R()<.4)turnover('INTERCEPTED!');
  else{G.ball=null;endPlay(0,'INCOMPLETE',1)}}
function dirv(c){
  let x=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),y=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(!x&&!y&&ptr.d){x=ptr.x-c.x;y=ptr.y-c.y;if(Math.hypot(x,y)<4)x=y=0}
  const m=Math.hypot(x,y);return m?[x/m,y/m]:[0,0]}
function mv(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1,s=Math.min(sp*dt,d);o.x+=dx/d*s;o.y+=dy/d*s;return d}

/* ---------- update ---------- */
function upd(dt){
  ptr.x=ptr.sx;ptr.y=ptr.sy+G.cam;
  G.cam+=(cl((G.car||G.ball||G.qb).y-250,0,FL-H)-G.cam)*Math.min(1,dt*6);
  if(G.ph=='dead'){G.mt-=dt;if(G.mt<=0)nxt();return}
  if(!['live','air','run'].includes(G.ph))return;
  G.t+=dt;G.clock-=dt;const o=G.o,dsp=44+o*2.5,rsp=56+U.wr*3,q=G.qb;
  G.rc.forEach(r=>{if(r===G.car||(r.stop&&r.i>=r.wp.length))return;
    const w=r.wp[Math.min(r.i,r.wp.length-1)];if(mv(r,w[0],w[1],rsp,dt)<3)r.i++});
  if(G.ph=='run'){
    const c=G.car,[x,y]=dirv(c);c.cd-=dt;if(x||y){c.dx=x;c.dy=y}
    const dash=c.dash>0,sp=dash?150:(c===q?50:58+U.wr*3);
    if(dash){c.dash-=dt;c.vx=c.dx*sp;c.vy=c.dy*sp}else{c.vx=x*sp;c.vy=y*sp}
    c.x=cl(c.x+c.vx*dt,16,224);c.y+=c.vy*dt;
    G.df.forEach(d=>mv(d,c.x+c.vx*.3,c.y+c.vy*.3,dsp*(d.t=='r'?.85:1),dt));
    if(c.y<=GOAL)return td();
    if(c.x<=17||c.x>=223)return endPlay(c.y,'OUT OF BOUNDS');
    if(!dash&&G.df.some(d=>Math.hypot(d.x-c.x,d.y-c.y)<6.5)){beep(120,.1);endPlay(c.y,'TACKLED')}
    return}
  G.df.forEach(d=>{
    if(d.t=='r'){if(G.t>.7)mv(d,q.x,q.y,12+o*2.5,dt)}
    else if(d.t=='c'){const r=G.rc[d.i];mv(d,r.x,r.y-5,dsp,dt)}
    else{G.t>2.4?mv(d,q.x,q.y,dsp*.7,dt):mv(d,q.x,G.los-24,30,dt)}});
  if(G.ph=='live'){
    const[x,y]=dirv(q);q.x=cl(q.x+x*48*dt,18,222);q.y=Math.min(q.y+y*48*dt,G.los+40);
    if(q.y<G.los-2){runner(q,48);return}
    if(G.df.some(d=>d.t!='c'&&Math.hypot(d.x-q.x,d.y-q.y)<7)){beep(120,.12);endPlay(q.y,'SACKED!')}
  }else{
    const b=G.ball,r=G.rc[b.i];b.t+=dt;
    b.d=mv(b,r.x,(r.stop&&r.i>=r.wp.length)?r.y:r.y-8,170+U.qb*15,dt);
    if(b.d<4)resolve();else if(b.t>3.5){G.ball=null;endPlay(0,'INCOMPLETE',1)}}}

/* ---------- drawing ---------- */
const T=(s,x,y,c='#fff',a='left')=>{X.fillStyle=c;X.textAlign=a;X.fillText(s,x,y)};
const fmt=t=>{t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const SK='#e8b48a';
function pl(o,c,c2){const cam=G?G.cam:0,x=Math.round(o.x),y=Math.round(o.y-cam),
  a=G&&(G.ph=='pre'||G.ph=='dead')?0:Math.floor(performance.now()/110+o.x)%2;
  X.fillStyle='#0006';X.fillRect(x-4,y+4,9,2);
  X.fillStyle='#223';X.fillRect(x-2,y+1+a,2,3);X.fillRect(x+1,y+2-a,2,3);
  X.fillStyle=c;X.fillRect(x-3,y-3,7,5);X.fillStyle=c2;X.fillRect(x-3,y-1,7,1);
  X.fillStyle=SK;X.fillRect(x-4,y-2,1,3);X.fillRect(x+4,y-2,1,3);
  X.fillStyle=c2;X.fillRect(x-2,y-7,5,4);X.fillStyle=c;X.fillRect(x,y-7,1,4);X.fillStyle=SK;X.fillRect(x-1,y-4,3,1)}
function menuBG(){const t=performance.now()/40,m=TM[S.tm==null?1:S.tm],o=TM[(S.tm==null?1:S.tm)+1&7|0];
  for(let i=0;i<19;i++){X.fillStyle=i%2?'#2b8a30':'#319a36';X.fillRect(0,((i*20-t)%380+380)%380-20,W,20)}
  X.fillStyle='#ffffff55';X.fillRect(0,0,2,H);X.fillRect(W-2,0,2,H);
  [50,100,150,200].forEach((x,i)=>pl({x,y:300+Math.sin(t/9+i)*5},m[1],m[2]));
  [75,125,175].forEach((x,i)=>pl({x,y:60+Math.sin(t/9+i*2)*5},o[1],o[2]))}
function draw(){
  JK.style.display=G&&G.ph=='run'?'block':'none';
  X.font='bold 8px "Courier New",monospace';
  if(!G){menuBG();return}
  X.drawImage(F,0,-Math.round(G.cam));
  X.fillStyle='#4af';X.fillRect(16,Math.round(G.los-G.cam),208,1);
  X.fillStyle='#fe3';X.fillRect(16,Math.round(G.los-G.toGo*YD-G.cam),208,1);
  G.df.forEach(d=>pl(d,G.oc,G.oc2));
  G.rc.forEach((r,i)=>{pl(r,G.mc,G.mc2);if(G.ph=='live')T(i+1+'',Math.round(r.x),Math.round(r.y-G.cam)-10,'#fff','center')});
  pl(G.qb,G.mc2,G.mc);
  if(G.car){const x=Math.round(G.car.x),y=Math.round(G.car.y-G.cam);X.fillStyle='#fff';X.fillRect(x-5,y+6,11,1);X.fillStyle='#7a4a1a';X.fillRect(x+3,y-1,4,3)}
  if(G.ball){const b=G.ball,h=Math.sin(Math.PI*Math.max(0,1-b.d/b.d0))*14,x=Math.round(b.x),y=Math.round(b.y-G.cam);
    X.fillStyle='#0005';X.fillRect(x-2,y+4,5,2);X.fillStyle='#7a4a1a';X.fillRect(x-2,Math.round(y-h)-2,5,3);X.fillStyle='#fff';X.fillRect(x,Math.round(y-h)-1,1,1)}
  X.fillStyle='#000d';X.fillRect(0,0,W,14);X.fillRect(0,H-14,W,14);
  X.fillStyle=G.mc;X.fillRect(0,0,5,14);X.fillStyle=G.oc;X.fillRect(W-5,0,5,14);
  T(`${TM[S.tm][0].slice(0,6).toUpperCase()} ${G.me}  -  ${G.op} ${opp()[0].slice(0,6).toUpperCase()}`,9,10);
  T(`Q${G.q} ${fmt(G.clock)}`,W-9,10,'#f5c400','right');
  const pos=G.yl<=50?'Own '+G.yl:'Opp '+(100-G.yl),dn=['1st','2nd','3rd','4th'][G.down-1]||'';
  T(`${dn} & ${G.toGo}  ${pos}`,4,H-4);
  T(G.ph=='pre'?'TAP / SPACE: SNAP':G.ph=='live'?'TAP A RECEIVER':G.ph=='run'?'RUN! SPACE: JUKE':'',W-4,H-4,'#f5c400','right');
  if(G.msg&&(G.ph=='dead'||G.ph=='pre')){const y=G.ph=='dead'?150:70;X.fillStyle='#000d';X.fillRect(0,y-12,W,20);X.fillStyle=G.mc;X.fillRect(0,y-12,W,1);T(G.msg,W/2,y+2,'#f5c400','center')}}

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(G)upd(dt);draw();requestAnimationFrame(loop)}

/* ---------- input ---------- */
function scr(e){const r=C.getBoundingClientRect();ptr.sx=(e.clientX-r.left)*W/r.width;ptr.sy=(e.clientY-r.top)*H/r.height}
C.addEventListener('pointerdown',e=>{if(!G)return;scr(e);ptr.x=ptr.sx;ptr.y=ptr.sy+G.cam;
  if(G.ph=='pre')return snap();
  if(G.ph=='live'){let bi=-1,bd=30;G.rc.forEach((r,i)=>{const d=Math.hypot(r.x-ptr.x,r.y-ptr.y);if(d<bd){bd=d;bi=i}});
    if(bi>=0)return throwTo(bi)}
  ptr.d=true});
C.addEventListener('pointermove',e=>scr(e));
addEventListener('pointerup',()=>ptr.d=false);addEventListener('pointercancel',()=>ptr.d=false);
JK.addEventListener('pointerdown',e=>{e.stopPropagation();juke()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(k.startsWith('arrow')||k==' ')e.preventDefault();
  if(!G)return;
